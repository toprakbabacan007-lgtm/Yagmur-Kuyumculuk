<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuyumcu & Saat Mağaza Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #475569;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* HEADER */
        header {
            background: #1e293b;
            padding: 20px 24px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h1 {
            font-size: 1.5rem;
            color: var(--accent-gold);
            font-weight: 700;
        }

        .iko-badge {
            font-size: 0.8rem;
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--accent-gold);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--accent-gold);
            font-weight: 600;
        }

        /* FILTERS & PRODUCTS GRID */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background-color: var(--bg-secondary);
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .filter-btn {
            background-color: var(--bg-primary);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: var(--accent-gold);
            color: var(--text-main);
        }

        .filter-btn.active {
            background-color: var(--accent-gold);
            color: #0f172a;
            border-color: var(--accent-gold);
            font-weight: 600;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-gold);
        }

        .product-category {
            font-size: 0.75rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .product-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .product-pricing {
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        .price-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .price-highlight {
            font-weight: 700;
            color: #fff;
            font-size: 1.1rem;
        }

        .installment-highlight {
            color: var(--accent-gold);
            font-size: 0.85rem;
            text-align: right;
            font-weight: 600;
        }

        .margin-tag {
            font-size: 0.75rem;
            color: var(--success);
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <header>
        <div class="brand">
            <h1>💎 MAĞAZA PANELİ</h1>
        </div>
        <div class="iko-badge">📡 İKO Canlı Fiyat Entegrasyonu Aktif</div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <!-- FİLTRELER -->
        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterData('all', this)">Tümü</button>
            <button class="filter-btn" onclick="filterData('gram', this)">Gram</button>
            <button class="filter-btn" onclick="filterData('ata', this)">Ata</button>
            <button class="filter-btn" onclick="filterData('ceyrek', this)">Çeyrek</button>
            <button class="filter-btn" onclick="filterData('yarim', this)">Yarım</button>
            <button class="filter-btn" onclick="filterData('tam', this)">Tam</button>
            <button class="filter-btn" onclick="filterData('kupe', this)">Küpe</button>
            <button class="filter-btn" onclick="filterData('bileklik', this)">Bileklik</button>
            <button class="filter-btn" onclick="filterData('yuzuk', this)">Yüzük</button>
            <button class="filter-btn" onclick="filterData('kolye', this)">Kolye</button>
            <button class="filter-btn" onclick="filterData('kelepce', this)">Kelepçe</button>
            <button class="filter-btn" onclick="filterData('alyans', this)">Alyans</button>
            <button class="filter-btn" onclick="filterData('saat', this)">Saat</button>
        </div>

        <!-- ÜRÜN LİSTESİ -->
        <div class="products-grid" id="productsContainer">
            <!-- Ürünler buraya yüklenecek -->
        </div>
    </div>
</div>

<script>
    // 1. İKO CANLI VERİLERİ (DÜŞÜŞ MARJLARI UYGULANMIŞ)
    const ikoRawPrices = [
        { title: "24 Ayar Has Gram Altın", category: "gram", rawPrice: 2500, minusMargin: 50, source: "iko" },
        { title: "Çeyrek Altın", category: "ceyrek", rawPrice: 4100, minusMargin: 60, source: "iko" },
        { title: "Yarım Altın", category: "yarim", rawPrice: 8200, minusMargin: 80, source: "iko" },
        { title: "Tam Altın", category: "tam", rawPrice: 16400, minusMargin: 100, source: "iko" },
        { title: "Ata Lira", category: "ata", rawPrice: 16800, minusMargin: 150, source: "iko" },
        { title: "22 Ayar Bilezik (Gram)", category: "bileklik", rawPrice: 2350, minusMargin: 150, source: "iko" }
    ];

    // 2. SENİN ELLE SİSTEME YÜKLEYECEĞİN TAKI ÜRÜNLERİ (Sadece bunlarda 3 Taksit yazar)
    const myJewelryProducts = [
        { title: "14 Ayar Taşlı Küpe", category: "kupe", price: 6000, source: "manual" },
        { title: "22 Ayar Dorika Bileklik", category: "bileklik", price: 15000, source: "manual" },
        { title: "14 Ayar Baget Yüzük", category: "yuzuk", price: 9000, source: "manual" },
        { title: "14 Ayar Zincir Kolye", category: "kolye", price: 12000, source: "manual" },
        { title: "22 Ayar Kelepçe", category: "kelepce", price: 45000, source: "manual" },
        { title: "Klasik Çift Alyans", category: "alyans", price: 7500, source: "manual" },
        { title: "Erkek Kol Saati", category: "saat", price: 14500, source: "manual" }
    ];

    function fmt(num) {
        return new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY' }).format(num);
    }

    // ÜRÜN LİSTELEME MANTIĞI
    let currentFilter = 'all';

    function renderList() {
        const container = document.getElementById('productsContainer');
        container.innerHTML = '';

        // İKO ürünlerinin fiyatlarını belirlenen eksi marjlar düşülerek hesaplıyoruz
        const calculatedIkoProducts = ikoRawPrices.map(item => {
            const finalPrice = Math.max(0, item.rawPrice - item.minusMargin);
            return {
                title: item.title,
                category: item.category,
                price: finalPrice,
                minusMargin: item.minusMargin,
                source: "iko"
            };
        });

        const allItems = [...calculatedIkoProducts, ...myJewelryProducts];

        const list = currentFilter === 'all' 
            ? allItems 
            : allItems.filter(item => item.category === currentFilter);

        list.forEach(item => {
            const card = document.createElement('div');
            card.className = 'product-card';

            let footerInfo = '';
            
            if (item.source === 'manual' && item.category !== 'saat') {
                // Senin elle eklediğin TAKI ürünü -> 3 Taksit yazar
                const monthly = item.price / 3;
                footerInfo = `<div class="installment-highlight">💳 Kart 3 Taksit: 3 x ${fmt(monthly)}</div>`;
            } else if (item.source === 'iko') {
                // İKO ürünü -> Taksit yok
                footerInfo = `<div class="margin-tag">📡 İKO Canlı Fiyat</div>`;
            } else {
                footerInfo = `<div style="font-size:0.8rem; color:var(--text-muted); text-align:right;">Tek Çekim</div>`;
            }

            card.innerHTML = `
                <div>
                    <div class="product-category">${item.category}</div>
                    <div class="product-title">${item.title}</div>
                </div>
                <div class="product-pricing">
                    <div class="price-line">
                        <span style="color:var(--text-muted);">Satış Fiyatı:</span>
                        <span class="price-highlight">${fmt(item.price)}</span>
                    </div>
                    ${footerInfo}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterData(cat, btn) {
        currentFilter = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderList();
    }

    // İlk Çalıştırma
    renderList();
</script>

</body>
</html>
