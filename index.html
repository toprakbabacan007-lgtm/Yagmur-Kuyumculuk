<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuyumcu & Saat Mağaza Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #475569;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 1024px) {
            .container {
                grid-template-columns: 320px 1fr;
            }
        }

        /* HEADER */
        header {
            grid-column: 1 / -1;
            background: #1e293b;
            padding: 18px 24px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h1 {
            font-size: 1.4rem;
            color: var(--accent-gold);
            font-weight: 700;
        }

        .iko-badge {
            font-size: 0.75rem;
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--accent-gold);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid var(--accent-gold);
            font-weight: 600;
        }

        /* SIDEBAR - ANLIK GRAM HESAPLAMA */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--bg-secondary);
            border-radius: 14px;
            padding: 18px;
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 14px;
            color: var(--accent-gold);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .result-box {
            background-color: var(--bg-primary);
            border: 1px solid var(--accent-gold);
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .result-val {
            font-weight: 700;
            color: var(--accent-gold);
            font-size: 1.1rem;
        }

        /* FILTERS & PRODUCTS GRID */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background-color: var(--bg-secondary);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .filter-btn {
            background-color: var(--bg-primary);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
        }

        .filter-btn.active {
            background-color: var(--accent-gold);
            color: #0f172a;
            border-color: var(--accent-gold);
            font-weight: 600;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 16px;
        }

        .product-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-category {
            font-size: 0.7rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            font-weight: 600;
        }

        .product-title {
            font-size: 1rem;
            font-weight: 600;
            margin: 4px 0 12px 0;
        }

        .product-pricing {
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }

        .price-line {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .price-highlight {
            font-weight: 700;
            color: #fff;
        }

        .installment-highlight {
            color: var(--accent-gold);
            font-size: 0.8rem;
            text-align: right;
            font-weight: 600;
        }

        .margin-tag {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <header>
        <div class="brand">
            <h1>💎 MAĞAZA PANELİ</h1>
        </div>
        <div class="iko-badge">📡 İKO Canlı Fiyat Entegrasyonu Aktif</div>
    </header>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <!-- ANLIK İKO GRAM HESABI (-50 TL EKSİ MARJLI) -->
        <div class="card">
            <div class="card-title">⚡ Hızlı Gram Fiyat Hesaplayıcı</div>
            <div class="form-group">
                <label>Miktar (Gram):</label>
                <input type="number" id="calcGram" class="form-control" value="10" placeholder="Örn: 10">
            </div>
            <div class="form-group">
                <label>İKO Ham Has Fiyatı (TL):</label>
                <input type="number" id="calcUnitPrice" class="form-control" value="2500" placeholder="İKO Fiyatı">
            </div>

            <div class="result-box">
                <div class="result-row">
                    <span>Satış Fiyatı (50 TL Eksi):</span>
                    <span class="result-val" id="resGramUnitPrice">0 TL/gr</span>
                </div>
                <div class="result-row" style="margin-top: 8px; border-top: 1px dashed var(--border-color); padding-top: 8px;">
                    <span>Toplam TL:</span>
                    <span class="result-val" id="resWire">0 TL</span>
                </div>
            </div>
        </div>

        <!-- MAĞAZA KONUMU -->
        <div class="card">
            <div class="card-title">📍 Mağaza Konumu</div>
            <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom: 8px;">Adres: Kuyumcular Çarşısı No: 42</p>
            <a href="https://maps.google.com" target="_blank" style="color: var(--accent-gold); font-size: 0.85rem; text-decoration: none; font-weight: 600;">🗺️ Haritalarda Aç &rarr;</a>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <!-- FİLTRELER -->
        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterData('all', this)">Tümü</button>
            <button class="filter-btn" onclick="filterData('gram', this)">Gram</button>
            <button class="filter-btn" onclick="filterData('ata', this)">Ata</button>
            <button class="filter-btn" onclick="filterData('ceyrek', this)">Çeyrek</button>
            <button class="filter-btn" onclick="filterData('yarim', this)">Yarım</button>
            <button class="filter-btn" onclick="filterData('tam', this)">Tam</button>
            <button class="filter-btn" onclick="filterData('kupe', this)">Küpe</button>
            <button class="filter-btn" onclick="filterData('bileklik', this)">Bileklik</button>
            <button class="filter-btn" onclick="filterData('yuzuk', this)">Yüzük</button>
            <button class="filter-btn" onclick="filterData('kolye', this)">Kolye</button>
            <button class="filter-btn" onclick="filterData('kelepce', this)">Kelepçe</button>
            <button class="filter-btn" onclick="filterData('alyans', this)">Alyans</button>
            <button class="filter-btn" onclick="filterData('saat', this)">Saat</button>
        </div>

        <!-- ÜRÜN LİSTESİ -->
        <div class="products-grid" id="productsContainer">
            <!-- Ürünler buraya yüklenecek -->
        </div>
    </div>
</div>

<script>
    // 1. İKO CANLI VERİLERİ VE EKSİ MARJ KURALLARI
    const ikoRawPrices = [
        { title: "24 Ayar Has Gram Altın", category: "gram", rawPrice: 2500, minusMargin: 50, source: "iko" },
        { title: "Çeyrek Altın", category: "ceyrek", rawPrice: 4100, minusMargin: 60, source: "iko" },
        { title: "Yarım Altın", category: "yarim", rawPrice: 8200, minusMargin: 80, source: "iko" },
        { title: "Tam Altın", category: "tam", rawPrice: 16400, minusMargin: 100, source: "iko" },
        { title: "Ata Lira", category: "ata", rawPrice: 16800, minusMargin: 150, source: "iko" },
        { title: "22 Ayar Bilezik (Gram)", category: "bileklik", rawPrice: 2350, minusMargin: 150, source: "iko" }
    ];

    // 2. SENİN ELLE SİSTEME YÜKLEYECEĞİN TAKI ÜRÜNLERİ (Sadece bunlarda 3 Taksit yazar)
    const myJewelryProducts = [
        { title: "14 Ayar Taşlı Küpe", category: "kupe", price: 6000, source: "manual" },
        { title: "22 Ayar Dorika Bileklik", category: "bileklik", price: 15000, source: "manual" },
        { title: "14 Ayar Baget Yüzük", category: "yuzuk", price: 9000, source: "manual" },
        { title: "14 Ayar Zincir Kolye", category: "kolye", price: 12000, source: "manual" },
        { title: "22 Ayar Kelepçe", category: "kelepce", price: 45000, source: "manual" },
        { title: "Klasik Çift Alyans", category: "alyans", price: 7500, source: "manual" },
        { title: "Erkek Kol Saati", category: "saat", price: 14500, source: "manual" }
    ];

    function fmt(num) {
        return new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY' }).format(num);
    }

    // ANLIK GRAM HESAPLAYICI (İKO Ham Gram - 50 TL) x Miktar
    const gramInput = document.getElementById('calcGram');
    const unitPriceInput = document.getElementById('calcUnitPrice');

    function calculateGram() {
        const g = parseFloat(gramInput.value) || 0;
        const rawP = parseFloat(unitPriceInput.value) || 0;
        
        // Gramda 50 TL eksi düşüyoruz
        const finalUnitPrice = Math.max(0, rawP - 50);
        const total = g * finalUnitPrice;

        document.getElementById('resGramUnitPrice').innerText = fmt(finalUnitPrice) + "/gr";
        document.getElementById('resWire').innerText = fmt(total);
    }

    gramInput.addEventListener('input', calculateGram);
    unitPriceInput.addEventListener('input', calculateGram);

    // ÜRÜN LİSTELEME MANTIĞI
    let currentFilter = 'all';

    function renderList() {
        const container = document.getElementById('productsContainer');
        container.innerHTML = '';

        // İKO ürünlerinin fiyatlarını eksi marjı düşerek hesaplıyoruz
        const calculatedIkoProducts = ikoRawPrices.map(item => {
            const finalPrice = Math.max(0, item.rawPrice - item.minusMargin);
            return {
                title: item.title,
                category: item.category,
                price: finalPrice,
                minusMargin: item.minusMargin,
                source: "iko"
            };
        });

        const allItems = [...calculatedIkoProducts, ...myJewelryProducts];

        const list = currentFilter === 'all' 
            ? allItems 
            : allItems.filter(item => item.category === currentFilter);

        list.forEach(item => {
            const card = document.createElement('div');
            card.className = 'product-card';

            let footerInfo = '';
            
            if (item.source === 'manual' && item.category !== 'saat') {
                // Senin elle eklediğin TAKI ürünü -> 3 Taksit yazar
                const monthly = item.price / 3;
                footerInfo = `<div class="installment-highlight">💳 Kart 3 Taksit: 3 x ${fmt(monthly)}</div>`;
            } else if (item.source === 'iko') {
                // İKO ürünü -> Taksit yok, uygulanan eksi düşüş yazar
                footerInfo = `<div class="margin-tag">📡 İKO Canlı (-${item.minusMargin} TL Düşüldü)</div>`;
            } else {
                footerInfo = `<div style="font-size:0.75rem; color:var(--text-muted); text-align:right;">Tek Çekim</div>`;
            }

            card.innerHTML = `
                <div>
                    <div class="product-category">${item.category}</div>
                    <div class="product-title">${item.title}</div>
                </div>
                <div class="product-pricing">
                    <div class="price-line">
                        <span style="color:var(--text-muted);">Satış Fiyatı:</span>
                        <span class="price-highlight">${fmt(item.price)}</span>
                    </div>
                    ${footerInfo}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterData(cat, btn) {
        currentFilter = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderList();
    }

    // İlk Çalıştırma
    calculateGram();
    renderList();
</script>

</body>
</html>
